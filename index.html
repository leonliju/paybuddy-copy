<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta
      name="description"
      content="PayBuddy - Modular AI-powered personal financial intelligence dashboard in Black & Silver"
    />
    <title>PayBuddy - Financial Intelligence</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;600;700;800&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS with custom CRED & Silver Noir fintech design tokens -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              background: "#0B0B0C",
              "surface-card": "#141416",
              "surface-elevated": "#1A1A1E",
              "surface-hover": "#222226",
              "surface-subtle": "rgba(255, 255, 255, 0.03)",
              // Black & Silver Platinum Palette
              "brand-silver": "#E4E4E7",
              "brand-chrome": "#F4F4F5",
              "brand-titanium": "#A1A1AA",
              "brand-steel": "#71717A",
              "brand-cyan": "#00D09C",
              "text-primary": "#FFFFFF",
              "text-secondary": "#A1A1AA",
              "text-muted": "#71717A",
              "border-subtle": "rgba(255, 255, 255, 0.08)",
              "border-silver": "rgba(228, 228, 231, 0.2)",
              "border-elevated": "rgba(255, 255, 255, 0.14)",
              "accent-silver": "#E4E4E7",
              "accent-green": "#00D09C",
              "accent-amber": "#F59E0B",
              "accent-red": "#EF4444",
              // Aliases for luxury monochrome styling
              "primary": "#FFFFFF",
              "primary-container": "#18181B",
              "secondary": "#E4E4E7",
              "secondary-container": "#202024",
              "on-surface": "#FFFFFF",
              "on-surface-variant": "#A1A1AA",
              "outline": "#27272A",
              "outline-variant": "rgba(255, 255, 255, 0.08)",
              "error": "#EF4444",
              "error-container": "rgba(239, 68, 68, 0.12)"
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Sora", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
              cinematic: ["Cinzel", "serif"],
              "display-lg": ["Sora", "sans-serif"],
              "headline-lg": ["Sora", "sans-serif"],
              "label-sm": ["JetBrains Mono", "monospace"],
              "body-md": ["Inter", "sans-serif"]
            },
            boxShadow: {
              "silver-glow": "0 0 35px -5px rgba(255, 255, 255, 0.18)",
              "silver-subtle": "0 4px 24px -2px rgba(228, 228, 231, 0.12)",
              "silver-flare": "0 0 50px rgba(244, 244, 245, 0.35)",
              "green-glow": "0 0 25px -5px rgba(0, 208, 156, 0.35)",
              "card-depth": "0 8px 32px 0 rgba(0, 0, 0, 0.65)",
              "glass": "0 8px 32px 0 rgba(0, 0, 0, 0.7)",
              "bottom-sheet": "0 -10px 40px rgba(0, 0, 0, 0.9)"
            },
            backgroundImage: {
              "silver-gradient": "linear-gradient(135deg, #FFFFFF 0%, #E4E4E7 35%, #A1A1AA 70%, #D4D4D8 100%)",
              "silver-gradient-subtle": "linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(161, 161, 170, 0.04) 100%)",
              "metallic-sheen": "linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.25) 50%, transparent 100%)",
              "card-gradient": "linear-gradient(180deg, #141416 0%, #0E0E10 100%)",
              "elevated-gradient": "linear-gradient(180deg, #1C1C20 0%, #121214 100%)",
              "glow-radial": "radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.12) 0%, transparent 70%)",
              "silver-radial": "radial-gradient(circle at 50% 50%, rgba(228, 228, 231, 0.15) 0%, transparent 70%)"
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0B0B0C;
        color: #FFFFFF;
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      .sn-tabular {
        font-variant-numeric: tabular-nums;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 9999px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body class="bg-[#0B0B0C] text-white antialiased min-h-screen selection:bg-white selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
